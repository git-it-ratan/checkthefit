<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .habitus-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }

        .seal-circle {
            width: 40px;
            height: 40px;
            border: 1px solid #1a1a1a;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seal-line {
            width: 1px;
            height: 24px;
            background-color: #1a1a1a;
            position: absolute;
        }

        .seal-dot {
            width: 4px;
            height: 4px;
            background-color: #d4af37;
            /* Gold accent */
            border-radius: 50%;
            z-index: 2;
        }

        /* For the text portion */
        .logo-text {
            font-family: "Georgia", serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.4rem;
            margin-top: 1rem;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="habitus-logo">
        <div class="seal-circle">
            <div class="seal-line"></div>
            <div class="seal-dot"></div>
        </div>
        <div class="logo-text">Habitus</div>
    </div>
</body>

</html>
